<!DOCTYPE html>
<html>
<head>
    <title>Login System</title>

    <style>
        body{
            font-family: Arial;
            background:#f4f4f4;
        }

        .container{
            width:400px;
            margin:50px auto;
            background:white;
            padding:20px;
            border-radius:10px;
        }

        h2{
            text-align:center;
        }

        input{
            width:100%;
            padding:10px;
            margin-top:10px;
        }

        button{
            width:100%;
            padding:10px;
            margin-top:15px;
            background:#007bff;
            color:white;
            border:none;
            cursor:pointer;
        }

        .switch{
            display:flex;
            justify-content:space-between;
            margin-bottom:20px;
        }

        .tab{
            width:48%;
            padding:10px;
            text-align:center;
            background:#ddd;
            cursor:pointer;
            border-radius:5px;
        }

        .active{
            background:#007bff;
            color:white;
        }

        .hidden{
            display:none;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="switch">
        <div class="tab active" onclick="showTeacher()">Teacher</div>
        <div class="tab" onclick="showStudent()">Student</div>
    </div>

    <!-- TEACHER -->
    <form id="teacherForm" action="/login" method="POST">
        <h2>Teacher Login</h2>

        <!-- FIX: role -->
        <input type="hidden" name="role" value="teacher">

        <input type="text" name="username" placeholder="Teacher ID" required>
        <input type="password" name="password" placeholder="Password" required>

        <button type="submit">Login</button>
    </form>

    <!-- STUDENT -->
    <form id="studentForm" class="hidden" action="/login" method="POST">
        <h2>Student Login</h2>

        <!-- FIX: role -->
        <input type="hidden" name="role" value="student">

        <input type="text" name="student_code" placeholder="Student Code" required>

        <button type="submit">Login</button>
    </form>

</div>

<script>
function showTeacher(){
    document.getElementById("teacherForm").classList.remove("hidden");
    document.getElementById("studentForm").classList.add("hidden");
}

function showStudent(){
    document.getElementById("studentForm").classList.remove("hidden");
    document.getElementById("teacherForm").classList.add("hidden");
}
</script>

</body>
</html>
