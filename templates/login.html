<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background: linear-gradient(135deg,#667eea,#764ba2);
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .card{
            width:400px;
            padding:20px;
            border-radius:15px;
        }
    </style>
</head>

<body>

<div class="card shadow">

    <h4 class="text-center mb-3">Student Score System</h4>

    <form method="POST" action="/">

        <!-- ROLE -->
        <select name="role" class="form-control mb-3" onchange="switchForm(this.value)">
            <option value="student">Student</option>
            <option value="teacher">Teacher</option>
        </select>

        <!-- TEACHER -->
        <div id="teacherBox">
            <input class="form-control mb-2" name="username" placeholder="Teacher Username">
            <input class="form-control mb-2" name="password" type="password" placeholder="Teacher Password">
        </div>

        <!-- STUDENT -->
        <div id="studentBox">
            <input class="form-control mb-2" name="student_code" placeholder="Student Code">
            <input class="form-control mb-2" name="password" type="password" placeholder="Password">
        </div>

        <button class="btn btn-primary w-100">Login</button>

    </form>

</div>

<script>
function switchForm(role){

    const teacherBox = document.getElementById("teacherBox");
    const studentBox = document.getElementById("studentBox");

    if(role === "teacher"){
        teacherBox.style.display = "block";
        studentBox.style.display = "none";
    } else {
        teacherBox.style.display = "none";
        studentBox.style.display = "block";
    }
}

window.onload = function(){
    switchForm("student");
}
</script>

</body>
</html>
